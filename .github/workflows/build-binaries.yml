name: Build Binaries

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release_id:
        required: true
        type: string

jobs:
  build-windows:
    name: "Windows (x64)"
    runs-on: windows-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bin-path: bun-bin
          bun-version: latest

      - name: Install client dependencies
        working-directory: client
        run: bun install

      - name: Build client
        working-directory: client
        run: bun run build

      - name: Move build folder
        run: Move-Item -Path client/build -Destination .

      - name: Install server dependencies
        run: bun install

      - name: Generate migrations
        run: bun run generate-migrations

      - name: Generate integrations
        run: bun run generate-integrations

      - name: Generate client embed
        run: bun run generate-client-embed

      - name: Compile binary
        run: bun build --compile --compile-autoload-package-json --external pg-hstore --external pg --target=bun-windows-x64 server/index.js --outfile MySpeed-CN.exe

      - name: Download speedtest binaries
        shell: pwsh
        run: |
          # 从本项目 Release 内置 CLI 资产下载 (由人工上传至 CLI_TAG, 稳定可复现)
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v1.1.1"
          New-Item -ItemType Directory -Force -Path bin

          Invoke-WebRequest -Uri "$base/speedtest-ookla-1.2.0-win64.exe" -OutFile bin/speedtest.exe
          Invoke-WebRequest -Uri "$base/librespeed-cli-1.0.10-windows-amd64.exe" -OutFile bin/librespeed-cli.exe
          Invoke-WebRequest -Uri "$base/cfspeedtest-2.2.2-windows-x64.exe" -OutFile bin/cfspeedtest.exe

          Write-Host "bin/ contents:"
          Get-ChildItem bin

      - name: Create release archive
        shell: pwsh
        run: |
          Compress-Archive -Path MySpeed-CN.exe, bin -DestinationPath MySpeed-CN-windows-x64.zip
          Write-Host "Archive created: MySpeed-CN-windows-x64.zip"

      - name: Upload standalone to Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ inputs.release_id }},
              name: 'MySpeed-CN.exe',
              data: fs.readFileSync('MySpeed-CN.exe')
            });

      - name: Upload archive to Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ inputs.release_id }},
              name: 'MySpeed-CN-windows-x64.zip',
              data: fs.readFileSync('MySpeed-CN-windows-x64.zip')
            });

  build-linux:
    name: "Linux (${{ matrix.arch }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: bun-linux-x64
            runner: ubuntu-latest
            artifact_name: MySpeed-CN-linux-x64
            ookla_suffix: linux-x86_64.tgz
            libre_suffix: linux_amd64.tar.gz
            cf_suffix: x86_64-unknown-linux-gnu.tar.gz
          - arch: arm64
            target: bun-linux-arm64
            runner: ubuntu-24.04-arm
            artifact_name: MySpeed-CN-linux-arm64
            ookla_suffix: linux-aarch64.tgz
            libre_suffix: linux_arm64.tar.gz
            cf_suffix: aarch64-unknown-linux-gnu.tar.gz

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install client dependencies
        working-directory: client
        run: bun install

      - name: Build client
        working-directory: client
        run: bun run build

      - name: Move build folder
        run: mv client/build .

      - name: Install server dependencies
        run: bun install

      - name: Generate migrations
        run: bun run generate-migrations

      - name: Generate integrations
        run: bun run generate-integrations

      - name: Generate client embed
        run: bun run generate-client-embed

      - name: Compile binary
        run: bun build --compile --compile-autoload-package-json --external pg-hstore --external pg --target=${{ matrix.target }} server/index.js --outfile MySpeed-CN

      - name: Download speedtest binaries
        run: |
          # 从本项目 Release v1.1.1 下载 (资产与官方同命名, 内置为项目自有资产, 稳定可复现)
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v1.1.1"
          mkdir -p bin

          # Ookla Speedtest CLI v1.2.0
          curl -fsSL "$base/ookla-speedtest-1.2.0-${{ matrix.ookla_suffix }}" -o /tmp/ookla.tgz
          tar -xzf /tmp/ookla.tgz -C bin speedtest
          chmod +x bin/speedtest
          rm /tmp/ookla.tgz

          # LibreSpeed CLI v1.0.10
          # 资产名与上游一致(不含版本号): librespeed-cli_<os>_<arch>.tar.gz
          curl -fsSL "$base/librespeed-cli_${{ matrix.libre_suffix }}" -o /tmp/libre.tar.gz
          tar -xzf /tmp/libre.tar.gz -C bin librespeed-cli
          chmod +x bin/librespeed-cli
          rm /tmp/libre.tar.gz

          # Cloudflare cfspeedtest v2.2.2
          curl -fsSL "$base/cfspeedtest-${{ matrix.cf_suffix }}" -o /tmp/cf.tar.gz
          tar -xzf /tmp/cf.tar.gz -C bin cfspeedtest
          chmod +x bin/cfspeedtest
          rm /tmp/cf.tar.gz

          ls -la bin/

      - name: Create release archive
        run: |
          tar -czf ${{ matrix.artifact_name }}.tar.gz MySpeed-CN bin/
          ls -lh ${{ matrix.artifact_name }}.tar.gz

      - name: Upload standalone to Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ inputs.release_id }},
              name: '${{ matrix.artifact_name }}',
              data: fs.readFileSync('MySpeed-CN')
            });

      - name: Upload archive to Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ inputs.release_id }},
              name: '${{ matrix.artifact_name }}.tar.gz',
              data: fs.readFileSync('${{ matrix.artifact_name }}.tar.gz')
            });

  build-macos:
    name: "macOS (${{ matrix.arch }})"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: bun-darwin-x64
            artifact_name: MySpeed-CN-macos-x64
            libre_suffix: darwin_amd64.tar.gz
            ookla_asset: ookla-speedtest-go-1.7.0-macosx-x86_64.tar.gz
          - arch: arm64
            target: bun-darwin-arm64
            artifact_name: MySpeed-CN-macos-arm64
            libre_suffix: darwin_arm64.tar.gz
            ookla_asset: ookla-speedtest-go-1.7.0-macosx-arm64.tar.gz

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install client dependencies
        working-directory: client
        run: bun install

      - name: Build client
        working-directory: client
        run: bun run build

      - name: Move build folder
        run: mv client/build .

      - name: Install server dependencies
        run: bun install

      - name: Generate migrations
        run: bun run generate-migrations

      - name: Generate integrations
        run: bun run generate-integrations

      - name: Generate client embed
        run: bun run generate-client-embed

      - name: Compile binary
        run: bun build --compile --compile-autoload-package-json --external pg-hstore --external pg --target=${{ matrix.target }} server/index.js --outfile MySpeed-CN

      - name: Download speedtest binaries
        run: |
          # 从本项目 Release v1.1.1 下载。Ookla mac 官方源已 403, 使用兼容的
          # speedtest-go 镜像(同为 Ookla 协议, arm64 原生无需 Rosetta)。
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v1.1.1"
          mkdir -p bin

          # Ookla (speedtest-go 兼容镜像): 包内二进制名 speedtest-go → 重命名 speedtest
          curl -fsSL "$base/${{ matrix.ookla_asset }}" -o /tmp/ookla.tgz
          tar -xzf /tmp/ookla.tgz -C bin speedtest-go
          mv bin/speedtest-go bin/speedtest
          chmod +x bin/speedtest
          rm /tmp/ookla.tgz

          # LibreSpeed CLI v1.0.10
          # 资产名与上游一致(不含版本号): librespeed-cli_<os>_<arch>.tar.gz
          curl -fsSL "$base/librespeed-cli_${{ matrix.libre_suffix }}" -o /tmp/libre.tar.gz
          tar -xzf /tmp/libre.tar.gz -C bin librespeed-cli
          chmod +x bin/librespeed-cli
          rm /tmp/libre.tar.gz

          # Cloudflare cfspeedtest v2.2.2 (universal binary)
          curl -fsSL "$base/cfspeedtest-universal-apple-darwin.tar.gz" -o /tmp/cf.tar.gz
          tar -xzf /tmp/cf.tar.gz -C bin cfspeedtest
          chmod +x bin/cfspeedtest
          rm /tmp/cf.tar.gz

          ls -la bin/

      - name: Create release archive
        run: |
          tar -czf ${{ matrix.artifact_name }}.tar.gz MySpeed-CN bin/
          ls -lh ${{ matrix.artifact_name }}.tar.gz

      - name: Upload standalone to Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ inputs.release_id }},
              name: '${{ matrix.artifact_name }}',
              data: fs.readFileSync('MySpeed-CN')
            });

      - name: Upload archive to Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ inputs.release_id }},
              name: '${{ matrix.artifact_name }}.tar.gz',
              data: fs.readFileSync('${{ matrix.artifact_name }}.tar.gz')
            });

  build-zip:
    name: "Source ZIP"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install client dependencies
        working-directory: client
        run: bun install

      - name: Build client
        working-directory: client
        run: bun run build

      - name: Move build folder
        run: mv client/build .

      - name: Install server dependencies
        run: bun install

      - name: Generate migrations
        run: bun run generate-migrations

      - name: Generate integrations
        run: bun run generate-integrations

      - name: Create zip archive
        run: zip -r MySpeed-CN.zip build server package.json

      - name: Upload to Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ inputs.release_id }},
              name: 'MySpeed-CN.zip',
              data: fs.readFileSync('MySpeed-CN.zip')
            });
