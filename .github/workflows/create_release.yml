name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    name: "Create Release"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      release_id: ${{ steps.create_release.outputs.id }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: |
            MySpeed-CN v${{ steps.get_version.outputs.version }} — 自动构建发布。
            - 平台独立可执行文件（内含 Ookla / LibreSpeed / Cloudflare 测速 CLI）：Windows x64 / Linux x64 / Linux arm64 / macOS x64 / macOS arm64
            - 源码包：MySpeed-CN.zip
            构建产物由 build-binaries.yml 自动上传，完整源码见仓库 main 分支。
          draft: false
          prerelease: false
          generate_release_notes: false

  build-binaries:
    name: "Build Binaries"
    needs: create-release
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      release_id: ${{ needs.create-release.outputs.release_id }}
    secrets: inherit
