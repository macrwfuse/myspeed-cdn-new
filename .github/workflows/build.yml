name: Build & Release

on:
  # 标签发布统一走 create_release.yml（Release 流水线）；本流程仅保留手动触发用于调试/预发布构建
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install client dependencies
        working-directory: client
        run: bun install

      - name: Build client
        working-directory: client
        run: bun run build

      - name: Move build folder
        shell: pwsh
        run: Move-Item -Path client/build -Destination .

      - name: Install server dependencies
        run: bun install

      - name: Generate migrations & integrations
        run: |
          bun run generate-migrations
          bun run generate-integrations
          bun run generate-client-embed

      - name: Build Windows x64 executable
        run: |
          bun build --compile --compile-autoload-package-json --external pg-hstore --external pg --target=bun-windows-x64 server/index.js --outfile MySpeed-CN.exe

      - name: Download speedtest binaries
        shell: pwsh
        run: |
          # 从本项目 Release v1.1.1 下载内置 CLI 资产
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v1.1.1"
          New-Item -ItemType Directory -Force -Path bin

          Invoke-WebRequest -Uri "$base/speedtest-ookla-1.2.0-win64.exe" -OutFile bin/speedtest.exe
          Invoke-WebRequest -Uri "$base/librespeed-cli-1.0.10-windows-amd64.exe" -OutFile bin/librespeed-cli.exe
          Invoke-WebRequest -Uri "$base/cfspeedtest-2.2.2-windows-x64.exe" -OutFile bin/cfspeedtest.exe

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path MySpeed-CN.exe, bin -DestinationPath MySpeed-CN-windows-x64.zip

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: MySpeed-CN-Windows-x64-exe
          path: MySpeed-CN.exe

      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: MySpeed-CN-Windows-x64-zip
          path: MySpeed-CN-windows-x64.zip

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: bun-linux-x64
            runner: ubuntu-latest
            artifact_name: MySpeed-CN-linux-x64
            ookla_suffix: linux-x86_64.tgz
            libre_suffix: linux_amd64.tar.gz
            cf_suffix: x86_64-unknown-linux-gnu.tar.gz
          - arch: arm64
            target: bun-linux-arm64
            runner: ubuntu-24.04-arm
            artifact_name: MySpeed-CN-linux-arm64
            ookla_suffix: linux-aarch64.tgz
            libre_suffix: linux_arm64.tar.gz
            cf_suffix: aarch64-unknown-linux-gnu.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install client dependencies
        working-directory: client
        run: bun install

      - name: Build client
        working-directory: client
        run: bun run build

      - name: Move build folder
        run: mv client/build .

      - name: Install server dependencies
        run: bun install

      - name: Generate migrations & integrations
        run: |
          bun run generate-migrations
          bun run generate-integrations
          bun run generate-client-embed

      - name: Build Linux executable
        run: bun build --compile --compile-autoload-package-json --external pg-hstore --external pg --target=${{ matrix.target }} server/index.js --outfile MySpeed-CN

      - name: Download speedtest binaries
        run: |
          # 从本项目 Release v1.1.1 下载内置 CLI 资产
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v1.1.1"
          mkdir -p bin

          curl -fsSL "$base/ookla-speedtest-1.2.0-${{ matrix.ookla_suffix }}" -o /tmp/ookla.tgz
          tar -xzf /tmp/ookla.tgz -C bin speedtest
          chmod +x bin/speedtest
          rm /tmp/ookla.tgz

          curl -fsSL "$base/librespeed-cli_1.0.10_${{ matrix.libre_suffix }}" -o /tmp/libre.tar.gz
          tar -xzf /tmp/libre.tar.gz -C bin librespeed-cli
          chmod +x bin/librespeed-cli
          rm /tmp/libre.tar.gz

          curl -fsSL "$base/cfspeedtest-${{ matrix.cf_suffix }}" -o /tmp/cf.tar.gz
          tar -xzf /tmp/cf.tar.gz -C bin cfspeedtest
          chmod +x bin/cfspeedtest
          rm /tmp/cf.tar.gz

          ls -la bin/

      - name: Create release archive
        run: tar -czf ${{ matrix.artifact_name }}.tar.gz MySpeed-CN bin/

      - name: Upload standalone
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-exe
          path: MySpeed-CN

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-tar
          path: ${{ matrix.artifact_name }}.tar.gz

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: bun-darwin-x64
            artifact_name: MySpeed-CN-macos-x64
            libre_suffix: darwin_amd64.tar.gz
            ookla_asset: ookla-speedtest-go-1.7.0-macosx-x86_64.tar.gz
          - arch: arm64
            target: bun-darwin-arm64
            artifact_name: MySpeed-CN-macos-arm64
            libre_suffix: darwin_arm64.tar.gz
            ookla_asset: ookla-speedtest-go-1.7.0-macosx-arm64.tar.gz
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install client dependencies
        working-directory: client
        run: bun install

      - name: Build client
        working-directory: client
        run: bun run build

      - name: Move build folder
        run: mv client/build .

      - name: Install server dependencies
        run: bun install

      - name: Generate migrations & integrations
        run: |
          bun run generate-migrations
          bun run generate-integrations
          bun run generate-client-embed

      - name: Build macOS executable
        run: bun build --compile --compile-autoload-package-json --external pg-hstore --external pg --target=${{ matrix.target }} server/index.js --outfile MySpeed-CN

      - name: Download speedtest binaries
        run: |
          # 从本项目 Release v1.1.1 下载。Ookla mac 用 speedtest-go 兼容镜像(arm64 原生)
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v1.1.1"
          mkdir -p bin

          # Ookla (speedtest-go): 包内二进制名 speedtest-go → 重命名 speedtest
          curl -fsSL "$base/${{ matrix.ookla_asset }}" -o /tmp/ookla.tgz
          tar -xzf /tmp/ookla.tgz -C bin speedtest-go
          mv bin/speedtest-go bin/speedtest
          chmod +x bin/speedtest
          rm /tmp/ookla.tgz

          curl -fsSL "$base/librespeed-cli_1.0.10_${{ matrix.libre_suffix }}" -o /tmp/libre.tar.gz
          tar -xzf /tmp/libre.tar.gz -C bin librespeed-cli
          chmod +x bin/librespeed-cli
          rm /tmp/libre.tar.gz

          # Cloudflare universal binary
          curl -fsSL "$base/cfspeedtest-universal-apple-darwin.tar.gz" -o /tmp/cf.tar.gz
          tar -xzf /tmp/cf.tar.gz -C bin cfspeedtest
          chmod +x bin/cfspeedtest
          rm /tmp/cf.tar.gz

          ls -la bin/

      - name: Create release archive
        run: tar -czf ${{ matrix.artifact_name }}.tar.gz MySpeed-CN bin/

      - name: Upload standalone
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-exe
          path: MySpeed-CN

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-tar
          path: ${{ matrix.artifact_name }}.tar.gz

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: List all artifacts
        run: find dist/ -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MySpeed-CN-Windows-x64-exe/MySpeed-CN.exe
            dist/MySpeed-CN-Windows-x64-zip/MySpeed-CN-windows-x64.zip
            dist/MySpeed-CN-linux-x64-exe/MySpeed-CN
            dist/MySpeed-CN-linux-x64-tar/MySpeed-CN-linux-x64.tar.gz
            dist/MySpeed-CN-linux-arm64-exe/MySpeed-CN
            dist/MySpeed-CN-linux-arm64-tar/MySpeed-CN-linux-arm64.tar.gz
            dist/MySpeed-CN-macos-x64-exe/MySpeed-CN
            dist/MySpeed-CN-macos-x64-tar/MySpeed-CN-macos-x64.tar.gz
            dist/MySpeed-CN-macos-arm64-exe/MySpeed-CN
            dist/MySpeed-CN-macos-arm64-tar/MySpeed-CN-macos-arm64.tar.gz
          generate_release_notes: true
