name: Build & Release

on:
  # 标签发布统一走 create_release.yml（Release 流水线）；本流程仅保留手动触发用于调试/预发布构建
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install client dependencies
        working-directory: client
        run: bun install

      - name: Build client
        working-directory: client
        run: bun run build

      - name: Move build folder
        shell: pwsh
        run: Move-Item -Path client/build -Destination .

      - name: Install server dependencies
        run: bun install

      - name: Generate migrations & integrations
        run: |
          bun run generate-migrations
          bun run generate-integrations
          bun run generate-client-embed

      - name: Build Windows x64 executable
        run: |
          bun build --compile --compile-autoload-package-json --external pg-hstore --external pg --target=bun-windows-x64 server/index.js --outfile MySpeed-CN.exe

      - name: Download speedtest binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin

          # Ookla Speedtest CLI v1.2.0
          Invoke-WebRequest -Uri "https://install.speedtest.net/app/cli/ookla-speedtest-1.2.0-win64.zip" -OutFile ookla.zip
          Expand-Archive -Path ookla.zip -DestinationPath bin -Force
          Remove-Item ookla.zip

          # LibreSpeed CLI v1.0.10
          Invoke-WebRequest -Uri "https://github.com/librespeed/speedtest-cli/releases/download/v1.0.10/librespeed-cli_1.0.10_windows_amd64.zip" -OutFile libre.zip
          Expand-Archive -Path libre.zip -DestinationPath bin -Force
          Remove-Item libre.zip

          # Cloudflare cfspeedtest v2.2.2
          Invoke-WebRequest -Uri "https://github.com/code-inflation/cfspeedtest/releases/download/v2.2.2/cfspeedtest-x86_64-pc-windows-msvc.zip" -OutFile cf.zip
          Expand-Archive -Path cf.zip -DestinationPath bin -Force
          Remove-Item cf.zip

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path MySpeed-CN.exe, bin -DestinationPath MySpeed-CN-windows-x64.zip

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: MySpeed-CN-Windows-x64-exe
          path: MySpeed-CN.exe

      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: MySpeed-CN-Windows-x64-zip
          path: MySpeed-CN-windows-x64.zip

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: bun-linux-x64
            runner: ubuntu-latest
            artifact_name: MySpeed-CN-linux-x64
            ookla_suffix: linux-x86_64.tgz
            libre_suffix: linux_amd64.tar.gz
            cf_suffix: x86_64-unknown-linux-gnu.tar.gz
          - arch: arm64
            target: bun-linux-arm64
            runner: ubuntu-24.04-arm
            artifact_name: MySpeed-CN-linux-arm64
            ookla_suffix: linux-aarch64.tgz
            libre_suffix: linux_arm64.tar.gz
            cf_suffix: aarch64-unknown-linux-gnu.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install client dependencies
        working-directory: client
        run: bun install

      - name: Build client
        working-directory: client
        run: bun run build

      - name: Move build folder
        run: mv client/build .

      - name: Install server dependencies
        run: bun install

      - name: Generate migrations & integrations
        run: |
          bun run generate-migrations
          bun run generate-integrations
          bun run generate-client-embed

      - name: Build Linux executable
        run: bun build --compile --compile-autoload-package-json --external pg-hstore --external pg --target=${{ matrix.target }} server/index.js --outfile MySpeed-CN

      - name: Download speedtest binaries
        run: |
          mkdir -p bin

          curl -fsSL "https://install.speedtest.net/app/cli/ookla-speedtest-1.2.0-${{ matrix.ookla_suffix }}" -o /tmp/ookla.tgz
          tar -xzf /tmp/ookla.tgz -C bin speedtest
          chmod +x bin/speedtest
          rm /tmp/ookla.tgz

          curl -fsSL "https://github.com/librespeed/speedtest-cli/releases/download/v1.0.10/librespeed-cli_1.0.10_${{ matrix.libre_suffix }}" -o /tmp/libre.tar.gz
          tar -xzf /tmp/libre.tar.gz -C bin librespeed-cli
          chmod +x bin/librespeed-cli
          rm /tmp/libre.tar.gz

          curl -fsSL "https://github.com/code-inflation/cfspeedtest/releases/download/v2.2.2/cfspeedtest-${{ matrix.cf_suffix }}" -o /tmp/cf.tar.gz
          tar -xzf /tmp/cf.tar.gz -C bin cfspeedtest
          chmod +x bin/cfspeedtest
          rm /tmp/cf.tar.gz

          ls -la bin/

      - name: Create release archive
        run: tar -czf ${{ matrix.artifact_name }}.tar.gz MySpeed-CN bin/

      - name: Upload standalone
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-exe
          path: MySpeed-CN

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-tar
          path: ${{ matrix.artifact_name }}.tar.gz

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: bun-darwin-x64
            artifact_name: MySpeed-CN-macos-x64
            libre_suffix: darwin_amd64.tar.gz
          - arch: arm64
            target: bun-darwin-arm64
            artifact_name: MySpeed-CN-macos-arm64
            libre_suffix: darwin_arm64.tar.gz
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install client dependencies
        working-directory: client
        run: bun install

      - name: Build client
        working-directory: client
        run: bun run build

      - name: Move build folder
        run: mv client/build .

      - name: Install server dependencies
        run: bun install

      - name: Generate migrations & integrations
        run: |
          bun run generate-migrations
          bun run generate-integrations
          bun run generate-client-embed

      - name: Build macOS executable
        run: bun build --compile --compile-autoload-package-json --external pg-hstore --external pg --target=${{ matrix.target }} server/index.js --outfile MySpeed-CN

      - name: Download speedtest binaries
        run: |
          mkdir -p bin

          # Ookla (macOS)：官方 1.2.0 macos 资产 403，先试 universal 再回退 1.1.1 x86_64 (arm64 经 Rosetta)
          for ookla_url in \
            "https://install.speedtest.net/app/cli/ookla-speedtest-1.2.0-macos-universal.tgz" \
            "https://install.speedtest.net/app/cli/ookla-speedtest-1.1.1-macosx-x86_64.tgz"; do
            if curl -fsSL --retry 3 -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)" "$ookla_url" -o /tmp/ookla.tgz; then
              echo "ookla download OK: $ookla_url"
              break
            fi
            echo "ookla download failed: $ookla_url"
          done
          test -s /tmp/ookla.tgz || { echo "FATAL: Ookla macOS download failed"; exit 1; }
          tar -xzf /tmp/ookla.tgz -C bin speedtest
          chmod +x bin/speedtest
          rm /tmp/ookla.tgz

          curl -fsSL "https://github.com/librespeed/speedtest-cli/releases/download/v1.0.10/librespeed-cli_1.0.10_${{ matrix.libre_suffix }}" -o /tmp/libre.tar.gz
          tar -xzf /tmp/libre.tar.gz -C bin librespeed-cli
          chmod +x bin/librespeed-cli
          rm /tmp/libre.tar.gz

          # Cloudflare universal binary
          curl -fsSL "https://github.com/code-inflation/cfspeedtest/releases/download/v2.2.2/cfspeedtest-universal-apple-darwin.tar.gz" -o /tmp/cf.tar.gz
          tar -xzf /tmp/cf.tar.gz -C bin cfspeedtest
          chmod +x bin/cfspeedtest
          rm /tmp/cf.tar.gz

          ls -la bin/

      - name: Create release archive
        run: tar -czf ${{ matrix.artifact_name }}.tar.gz MySpeed-CN bin/

      - name: Upload standalone
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-exe
          path: MySpeed-CN

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-tar
          path: ${{ matrix.artifact_name }}.tar.gz

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: List all artifacts
        run: find dist/ -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MySpeed-CN-Windows-x64-exe/MySpeed-CN.exe
            dist/MySpeed-CN-Windows-x64-zip/MySpeed-CN-windows-x64.zip
            dist/MySpeed-CN-linux-x64-exe/MySpeed-CN
            dist/MySpeed-CN-linux-x64-tar/MySpeed-CN-linux-x64.tar.gz
            dist/MySpeed-CN-linux-arm64-exe/MySpeed-CN
            dist/MySpeed-CN-linux-arm64-tar/MySpeed-CN-linux-arm64.tar.gz
            dist/MySpeed-CN-macos-x64-exe/MySpeed-CN
            dist/MySpeed-CN-macos-x64-tar/MySpeed-CN-macos-x64.tar.gz
            dist/MySpeed-CN-macos-arm64-exe/MySpeed-CN
            dist/MySpeed-CN-macos-arm64-tar/MySpeed-CN-macos-arm64.tar.gz
          generate_release_notes: true
